version: 2

models:

  - name: agg_low6__game_metrics_daily
    description: >
      Cross-game daily metrics grain of (date_day, game_id, game_type, tenant_name).
      Covers all active game domains except elf_collectyourelf (no entries/contest
      concept). saracen, gana_gamezone, and elf_blast each contribute multiple
      game_ids because a single domain produces more than one game_type/sub-game.
      gana_gamezone's registrations are replicated identically across its 3
      game_ids (gana_predictor, gana_survivor, gana_bracket), and elf_blast's are
      replicated across its 2 game_ids (elf_blast, elf_ski), since registration is
      platform-level, not per-game — summing registrations across game_id will
      overcount for these domains. olybet_casino's registrations are a
      first-entry-date proxy, not true sign-up dates, since that domain has no
      users source table.
    columns:
      - name: date_day
        tests:
          - not_null
      - name: game_id
        tests:
          - not_null
      - name: game_type
        tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - pickem
                  - bracket
                  - fantasy
                  - streak
                  - spin_to_win
                  - candy_crush
                  - endless_runner
                  - connections
                  - trivia
                  - instant_win
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - date_day
              - game_id
              - game_type
              - tenant_name

  - name: agg_low6__cohort_retention_weekly
    description: >
      Cross-game weekly cohort retention grain of (game_id, game_type, tenant_name,
      cohort_week, activity_week). Reuses agg_{domain}__cohort_retention_weekly
      directly for cfl_fantasy, bet365_uf, opap_spintowin, and olybet_casino;
      built inline from entries for the other domains.
    columns:
      - name: cohort_week
        tests:
          - not_null
      - name: activity_week
        tests:
          - not_null
      - name: game_id
        tests:
          - not_null
      - name: game_type
        tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - pickem
                  - bracket
                  - fantasy
                  - streak
                  - spin_to_win
                  - candy_crush
                  - endless_runner
                  - connections
                  - trivia
                  - instant_win

  - name: agg_low6__all_game_metrics_daily
    description: >
      Union of agg_low6__game_metrics_daily with any archive table in
      ANALYTICS_ARCHIVE. Currently a pure passthrough view — no archive exists yet.

  - name: agg_low6__all_cohort_retention_weekly
    description: >
      Union of agg_low6__cohort_retention_weekly with any archive table in
      ANALYTICS_ARCHIVE. Currently a pure passthrough view — no archive exists yet.
