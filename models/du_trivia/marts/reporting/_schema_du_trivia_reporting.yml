version: 2

models:

  - name: rpt_du_trivia__growth_metrics_daily
    description: >
      One row per day per client, tenant and game_type, from du_trivia_start_date
      to today, on GST dates. Standard growth metrics (rpt_growth_metrics_daily
      macro).
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - date_day
              - client_id
              - tenant_id
              - game_type

  - name: rpt_du_trivia__cohort_retention_weekly
    description: >
      One row per cohort week per activity week per client, tenant and game_type.
      Cohort is the GST week of the user's first entry
      (rpt_cohort_retention_weekly macro).
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - cohort_week
              - activity_week
              - client_id
              - tenant_id
              - game_type

  - name: rpt_du_trivia__contest_performance_summary
    description: >
      One row per contest per tenant (rpt_contest_performance_summary macro).
      du trivia has no payouts, so paid_out_entries is 0.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - contest_id
              - tenant_id
