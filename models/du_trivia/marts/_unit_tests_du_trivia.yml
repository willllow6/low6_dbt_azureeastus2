version: 2

unit_tests:

  - name: test_du_trivia_growth_metrics_show_registrations_before_first_entry
    description: >
      rpt_growth_metrics_daily macro: with users but no entries yet, the spine
      still gets a row per day and registrations are counted.
    model: rpt_du_trivia__growth_metrics_daily
    overrides:
      vars:
        du_trivia_start_date: '2026-11-01'
        reporting_as_of_date: '2026-11-02'
    given:
      - input: ref('dim_du_trivia__users')
        rows:
          - {user_id: '1', client_id: du, tenant_id: du, tenant_name: DU, game_type: trivia, registered_at: '2026-11-01 12:00:00'}
      - input: ref('fct_du_trivia__entries')
        rows: []
      - input: ref('fct_du_trivia__user_activity_daily')
        rows: []
    expect:
      rows:
        - {date_day: '2026-11-01', tenant_name: DU, registrations: 1, entries: 0, dau: 0, wau: 0, mau: 0, first_entries: 0}
        - {date_day: '2026-11-02', tenant_name: DU, registrations: 0, entries: 0, dau: 0, wau: 0, mau: 0, first_entries: 0}

  - name: test_du_trivia_growth_metrics_fill_every_day
    description: >
      rpt_growth_metrics_daily macro on the gst date columns: every day from the
      start date to "today" gets a row, and registrations land on the GST date
      (22:00 UTC on the 1st is the 2nd in Dubai).
    model: rpt_du_trivia__growth_metrics_daily
    overrides:
      vars:
        du_trivia_start_date: '2026-11-01'
        reporting_as_of_date: '2026-11-03'
    given:
      - input: ref('dim_du_trivia__users')
        rows:
          - {user_id: '1', client_id: du, tenant_id: du, game_type: trivia, registered_at: '2026-11-01 12:00:00'}
          - {user_id: '2', client_id: du, tenant_id: du, game_type: trivia, registered_at: '2026-11-01 22:00:00'}
      - input: ref('fct_du_trivia__entries')
        rows:
          - {user_id: '1', client_id: du, tenant_id: du, tenant_name: DU, game_type: trivia, entry_date_gst: '2026-11-01', user_entry_number: 1}
          - {user_id: '1', client_id: du, tenant_id: du, tenant_name: DU, game_type: trivia, entry_date_gst: '2026-11-03', user_entry_number: 2}
          - {user_id: '2', client_id: du, tenant_id: du, tenant_name: DU, game_type: trivia, entry_date_gst: '2026-11-03', user_entry_number: 1}
      - input: ref('fct_du_trivia__user_activity_daily')
        rows:
          - {user_id: '1', client_id: du, tenant_id: du, game_type: trivia, activity_date_gst: '2026-11-01'}
          - {user_id: '1', client_id: du, tenant_id: du, game_type: trivia, activity_date_gst: '2026-11-03'}
          - {user_id: '2', client_id: du, tenant_id: du, game_type: trivia, activity_date_gst: '2026-11-03'}
    expect:
      rows:
        - {date_day: '2026-11-01', registrations: 1, entries: 1, dau: 1, wau: 1, mau: 1, first_entries: 1}
        - {date_day: '2026-11-02', registrations: 1, entries: 0, dau: 0, wau: 1, mau: 1, first_entries: 0}
        - {date_day: '2026-11-03', registrations: 0, entries: 2, dau: 2, wau: 2, mau: 2, first_entries: 1}

  - name: test_du_trivia_cohort_retention_counts_from_first_entry_week
    description: >
      rpt_cohort_retention_weekly macro on the gst date columns: users join the
      cohort of their first entry's week and retention is measured against it.
    model: rpt_du_trivia__cohort_retention_weekly
    given:
      - input: ref('fct_du_trivia__entries')
        rows:
          - {user_id: '1', client_id: du, tenant_id: du, tenant_name: DU, game_type: trivia, entry_date_gst: '2026-11-03'}
          - {user_id: '1', client_id: du, tenant_id: du, tenant_name: DU, game_type: trivia, entry_date_gst: '2026-11-04'}
          - {user_id: '1', client_id: du, tenant_id: du, tenant_name: DU, game_type: trivia, entry_date_gst: '2026-11-10'}
          - {user_id: '2', client_id: du, tenant_id: du, tenant_name: DU, game_type: trivia, entry_date_gst: '2026-11-05'}
    expect:
      rows:
        - {cohort_week: '2026-11-02', activity_week: '2026-11-02', weeks_since_cohort: 0, cohort_size: 2, retained_users: 2, retention_rate: 1.0}
        - {cohort_week: '2026-11-02', activity_week: '2026-11-09', weeks_since_cohort: 1, cohort_size: 2, retained_users: 1, retention_rate: 0.5}

  - name: test_du_trivia_contest_summary_counts_entrants
    description: >
      rpt_contest_performance_summary macro: a contest with no entries still gets
      a row with zeros, and paid_out_entries is 0 because there are no payouts.
    model: rpt_du_trivia__contest_performance_summary
    given:
      - input: ref('dim_du_trivia__contests')
        rows:
          - {contest_id: '10', tenant_id: du, contest_name: Day 1}
          - {contest_id: '11', tenant_id: du, contest_name: Day 2}
      - input: ref('fct_du_trivia__entries')
        rows:
          - {entry_id: a, user_id: '1', contest_id: '10', tenant_id: du, user_entry_number: 1}
          - {entry_id: b, user_id: '2', contest_id: '10', tenant_id: du, user_entry_number: 4}
    expect:
      rows:
        - {contest_id: '10', total_entries: 2, unique_entrants: 2, first_time_entrants: 1, paid_out_entries: 0}
        - {contest_id: '11', total_entries: 0, unique_entrants: 0, first_time_entrants: 0, paid_out_entries: 0}

  - name: test_du_trivia_contests_take_status_and_start_from_campaign
    description: >
      contest_status and is_active come from the campaign. starts_at is the
      contest date at the unlock time in the campaign's timezone, in UTC (09:00
      Dubai is 05:00 UTC), or midnight in that timezone with no unlock time.
    model: dim_du_trivia__contests
    given:
      - input: ref('stg_du_trivia__contests')
        rows:
          - {contest_id: '10', campaign_id: '1', contest_status_code: '1', contest_date: '2026-11-05'}
          - {contest_id: '11', campaign_id: '2', contest_status_code: '1', contest_date: '2026-11-05'}
      - input: ref('stg_du_trivia__campaigns')
        rows:
          - {campaign_id: '1', campaign_status: published, daily_unlock_time: '09:00', time_zone: Asia/Dubai}
          - {campaign_id: '2', campaign_status: archived, daily_unlock_time: null, time_zone: Asia/Dubai}
      - input: ref('stg_du_trivia__questions')
        rows:
          - {question_id: '100', contest_id: '10', question_points: 10}
          - {question_id: '101', contest_id: '10', question_points: 20}
    expect:
      rows:
        - {contest_id: '10', contest_status: published, is_active: true, questions: 2, max_points: 30, starts_at: '2026-11-05 05:00:00'}
        - {contest_id: '11', contest_status: archived, is_active: false, questions: 0, max_points: 0, starts_at: '2026-11-04 20:00:00'}

  - name: test_du_trivia_entries_join_selection_measures_and_number_entries
    description: >
      user_entry_number counts a user's entries in time order, selection measures
      join on entry_id, and an entry with no selections has zero counts.
      entry_date_gst is the Dubai date (21:00 UTC on the 4th is the 5th).
    model: fct_du_trivia__entries
    given:
      - input: ref('stg_du_trivia__entries')
        rows:
          - {entry_id: a, user_id: '1', contest_id: '10', entered_at: '2026-11-04 21:00:00'}
          - {entry_id: b, user_id: '1', contest_id: '11', entered_at: '2026-11-06 08:00:00'}
          - {entry_id: c, user_id: '2', contest_id: '10', entered_at: '2026-11-05 08:00:00'}
      - input: ref('int_du_trivia__selections_aggregated_to_entries')
        rows:
          - {entry_id: a, selections: 5, correct_selections: 3, elapsed_seconds: 40}
    expect:
      rows:
        - {entry_id: a, selections: 5, correct_selections: 3, elapsed_seconds: 40, user_entry_number: 1, entry_date_gst: '2026-11-05'}
        - {entry_id: b, selections: 0, correct_selections: 0, elapsed_seconds: null, user_entry_number: 2, entry_date_gst: '2026-11-06'}
        - {entry_id: c, selections: 0, correct_selections: 0, elapsed_seconds: null, user_entry_number: 1, entry_date_gst: '2026-11-05'}
